name = "logistics-intelligence-api"
main = "src/worker.py"
compatibility_date = "2026-07-24"
compatibility_flags = ["python_workers"]
find_additional_modules = true
base_dir = "src"

[vars]
ENVIRONMENT = "production"
OPENROUTER_MODEL = "google/gemma-4-26b-a4b-it:free"
ALLOWED_ORIGINS = "https://your-project.pages.dev"
PUBLIC_APP_URL = "https://your-project.pages.dev"

[secrets]
required = ["OPENROUTER_API_KEY", "TURNSTILE_SECRET_KEY"]

[python_modules]
excludes = [
  "**/*.pyc",
]

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "24072501"

  [ratelimits.simple]
  limit = 5
  period = 60
