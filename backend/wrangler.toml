name = "logistics-intelligence-api"
main = "src/worker.py"
compatibility_date = "2026-07-24"
compatibility_flags = ["python_workers"]
find_additional_modules = true
base_dir = "src"

[vars]
ENVIRONMENT = "production"
OPENROUTER_MODEL = "openrouter/free"
ALLOWED_ORIGINS = "https://logistics-intelligence-dashboard.pages.dev"
PUBLIC_APP_URL = "https://logistics-intelligence-dashboard.pages.dev"
TURNSTILE_AFTER_LOGIN = "false"

[secrets]
required = ["OPENROUTER_API_KEY", "USERNAME", "PASSWORD", "AUTH_SESSION_SECRET"]

[python_modules]
excludes = [
  "**/*.pyc",
]

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "24072501"

  [ratelimits.simple]
  limit = 5
  period = 60

[[d1_databases]]
binding = "CONVERSATIONS_DB"
database_name = "logistics-intelligence-history"
database_id = "1c527714-9803-4778-8844-97faca2b5a40"
migrations_dir = "migrations"
