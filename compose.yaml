services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_PATH: /app/data/mock_logistics_data.csv
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      ENVIRONMENT: development
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-reviewer@local.test}
      HISTORY_DB_PATH: /app/state/conversations.db
    volumes:
      - ./backend/src/app:/app/app
      - ./backend/tests:/app/tests
      - ./data:/app/data:ro
      - backend_state:/app/state
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_DEV_API_PROXY: http://backend:8000
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  backend_state:
